<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Armada UI kit: export</title>
    <link rel="stylesheet" href="armada-ui.css" />
    <style>
      /* The pieces scripts/export-ui.mjs screenshots for the native client: each [data-piece] is
         one PNG, with PAD px of room around the shape for the wobble and the offset shadow. */
      :root { --pad: 12px; }
      html, body {
        margin: 0; background: transparent;
        user-select: none; -webkit-user-select: none; touch-action: none;
      }
      body { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; padding: 8px; font-family: var(--ac-body); }
      [data-piece] { padding: var(--pad); display: inline-block; }
      [data-piece] > * { display: block; }
      [data-piece="progress"], [data-piece="progress_fill"] { padding: 0; }
      .panel { box-sizing: border-box; }
      .bubble-shape::before { border-radius: var(--ac-blob-bubble); }
      .round { --ac-fill: var(--ac-red); }
      .round::before { border-radius: var(--ac-blob-round); }
      .pressed::before { box-shadow: 1px 2px 0 var(--ac-ink); }
      .disc::before { border-radius: var(--ac-blob-round); }
      .tail svg { width: 34px; height: 30px; display: block; filter: url(#ac-wobble); }
      .tail path { stroke: var(--ac-ink); stroke-width: 4; stroke-linejoin: round; }
      .badge {
        width: 26px; height: 26px; box-sizing: border-box; border: 3px solid var(--ac-ink); border-radius: 50%;
        background: var(--ac-paper);
      }
      .tool { width: 48px; height: 48px; }
      .tool svg { width: 48px; height: 48px; display: block; filter: var(--ac-icon-shadow); }
    </style>
  </head>
  <body>
    <div data-piece="backpack_closed" data-slice="0">
      <div class="ac-backpack">
        <span class="ac-backpack__handle"></span><span class="ac-backpack__body"></span>
        <span class="ac-backpack__flap"></span><span class="ac-backpack__pocket"></span>
        <span class="ac-backpack__buckle"></span>
      </div>
    </div>
    <div data-piece="backpack_open" data-slice="0">
      <div class="ac-backpack is-open">
        <span class="ac-backpack__handle"></span><span class="ac-backpack__body"></span>
        <span class="ac-backpack__flap"></span><span class="ac-backpack__mouth"></span>
        <span class="ac-backpack__pocket"></span><span class="ac-backpack__buckle"></span>
      </div>
    </div>
    <div data-piece="progress" data-slice="0"><div class="ac-progress"></div></div>
    <div data-piece="progress_fill" data-slice="0"><div class="ac-progress__fill"></div></div>
    <div data-piece="hotbar" data-slice="34"><div class="panel ac-hand ac-umber" style="width: 180px; height: 110px"></div></div>
    <div data-piece="slot" data-slice="0"><div class="panel ac-slot" style="--ac-slot: 64px"></div></div>
    <div data-piece="slot_selected" data-slice="0"><div class="panel ac-slot is-selected" style="--ac-slot: 64px; transform: none"></div></div>
    <div data-piece="slot_empty" data-slice="0"><div class="panel ac-slot is-empty" style="--ac-slot: 64px"></div></div>
    <div data-piece="shop_row" data-slice="22"><div class="panel ac-row" style="width: 200px; height: 58px"></div></div>
    <div data-piece="shop_row_selected" data-slice="22"><div class="panel ac-row is-selected" style="width: 200px; height: 58px"></div></div>
    <div data-piece="shop_row_disabled" data-slice="22"><div class="panel ac-row is-disabled" style="width: 200px; height: 58px"></div></div>
    <div data-piece="toast" data-slice="22"><div class="panel ac-row is-toast" style="width: 200px; height: 58px"></div></div>
    <div data-piece="toast_warning" data-slice="22"><div class="panel ac-row is-toast is-warning" style="width: 200px; height: 58px"></div></div>
    <div data-piece="coin" data-slice="0"><div class="ac-coin"></div></div>
    <div data-piece="market_mark" data-slice="0"><div class="ac-mark"><div class="ac-coin"></div></div></div>
    <div data-piece="bubble" data-slice="34"><div class="panel ac-hand ac-cream bubble-shape" style="width: 240px; height: 64px"></div></div>
    <div data-piece="bubble_warning" data-slice="34"><div class="panel ac-hand ac-red bubble-shape" style="width: 240px; height: 64px"></div></div>
    <div data-piece="bubble_tail" data-slice="0" class="tail"><svg viewBox="0 0 34 30"><path d="M3 2 L14 28 L31 2" fill="#fff6e0" /></svg></div>
    <div data-piece="bubble_tail_warning" data-slice="0" class="tail"><svg viewBox="0 0 34 30"><path d="M3 2 L14 28 L31 2" fill="#e0543a" /></svg></div>
    <div data-piece="action" data-slice="0"><div class="panel ac-hand round" style="width: 104px; height: 104px"></div></div>
    <div data-piece="action_pressed" data-slice="0"><div class="panel ac-hand round pressed" style="width: 104px; height: 104px"></div></div>
    <div data-piece="stick_base" data-slice="0"><div class="ac-stick"></div></div>
    <div data-piece="stick_knob" data-slice="0"><div class="ac-stick__knob"></div></div>
    <div data-piece="stick_knob_run" data-slice="0"><div class="ac-stick__knob is-running"></div></div>
    <div data-piece="badge" data-slice="0"><div class="badge"></div></div>
    <div data-piece="tool_hand" data-slice="0" class="tool" data-tool="hand"></div>

    <script src="armada-ui.js"></script>
    <script>
      ArmadaUI.install();
      document.querySelectorAll("[data-tool]").forEach((node) => node.appendChild(ArmadaUI.toolIcon(node.dataset.tool)));
      document.querySelectorAll("[data-symbol]").forEach((node) => node.appendChild(ArmadaUI.symbolIcon(node.dataset.symbol)));
      document.documentElement.dataset.ready = "1";
    </script>
  </body>
</html>
