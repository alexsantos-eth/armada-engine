<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <base href="/" />
    <title>Yorch Adventure</title>
    <meta name="theme-color" content="#122034" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yorch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="0"></canvas>
    <script src="./mq_js_bundle.js?v=3"></script>
    <script src="./adapter.js?v=3"></script>
    <script>
      // Registers the minimal service worker that makes the site installable.
      // Relative to <base href="/">, so the same script works on /, /playground and /maker.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
