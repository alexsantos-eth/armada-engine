[package]
name = "iso-core"
version = "0.8.2"
edition = "2024"
default-run = "iso-core"
autobins = false

[[bin]]
name = "iso-core"
path = "src/main.rs"

[[bin]]
name = "pack_atlas"
path = "src/bin/pack_atlas.rs"

[[bin]]
name = "remeasure_atlas"
path = "src/bin/remeasure_atlas.rs"

[workspace]
members = [".", "crates/iso"]
resolver = "2"

[dependencies]
iso = { path = "crates/iso" }
image = "0.24"
macroquad = "0.4.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
