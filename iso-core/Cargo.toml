[package]
name = "iso-core"
version = "0.1.0"
edition = "2024"
default-run = "iso-core"

[workspace]
members = [".", "crates/armada-core"]
resolver = "2"

[dependencies]
armada-core = { path = "crates/armada-core" }
image = "0.24"
macroquad = "0.4.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
