<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #151d2a;

        display: block;

      const wasmUrl = new URL("../target/wasm32-unknown-unknown/release/iso-core.wasm", location.href);

        wasmUrl.searchParams.set("dev", Date.now().toString());
      }
      load(wasmUrl.href);
    </script>
