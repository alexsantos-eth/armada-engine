<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft round shadow. The engine stretches and rotates it on the ground (render/shadow.ts)
       and sets its opacity from the sun, so it is solid black with a feathered edge. -->
  <defs>
    <radialGradient id="shadow" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="1" />
      <stop offset="0.55" stop-color="#000" stop-opacity="0.9" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#shadow)" />
</svg>
